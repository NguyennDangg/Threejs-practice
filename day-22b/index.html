<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Day 22b - Anchored wave drift</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
        /* The canvas is transparent wherever blurAlpha falls to zero — the
           whole left side of the frame — so this colour is not decoration,
           it composites into the piece. #ffffff was fighting COLOR_BACK
           (#14181c) and blowing out the falloff into a hard bright edge. */
        background: #0d0c0b;
      }

      canvas {
        display: block;
      }

      .hud {
        position: fixed;
        bottom: 22px;
        left: 22px;
        z-index: 10;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 11px;
        letter-spacing: 0.14em;
        color: #8a8478;
        line-height: 1.8;
        pointer-events: none;
      }

      .hud .accent {
        color: #c1121f;
      }
    </style>
  </head>

  <body>
    <div class="hud">
      <span class="accent">LOG_22b</span> — Anchored wave drift<br />
      symmetric bake, composed in-shader · after Keita Yamada (p5aholic.me)
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
