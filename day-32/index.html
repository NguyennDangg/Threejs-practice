<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>day-32 | Audio Reactive</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        overflow: hidden;
        background: #05070c;
        color: #e8e8e8;
        font-family: "JetBrains Mono", ui-monospace, monospace;
      }
      .webgl {
        position: fixed;
        inset: 0;
        display: block;
        outline: none;
      }
      .hud {
        position: fixed;
        top: 24px;
        left: 24px;
        z-index: 10;
        font-size: 11px;
        pointer-events: none;
      }
      .hud .title {
        color: #38bdf8;
        letter-spacing: 0.16em;
        margin-bottom: 6px;
        font-weight: 600;
      }
      .hud .sub {
        color: #5a5a5a;
        line-height: 1.6;
      }
      .controls {
        position: fixed;
        bottom: 32px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        display: flex;
        gap: 12px;
        align-items: center;
        background: rgba(6, 6, 8, 0.9);
        border: 1px solid rgba(56, 189, 248, 0.3);
        padding: 16px 24px;
        border-radius: 999px;
      }
      .controls button {
        background: transparent;
        color: #5a5a5a;
        border: 1px solid rgba(255, 255, 255, 0.15);
        padding: 8px 16px;
        font: inherit;
        font-size: 10px;
        letter-spacing: 0.1em;
        cursor: pointer;
        border-radius: 999px;
        transition: all 0.2s;
      }
      .controls button:hover {
        color: #38bdf8;
        border-color: #38bdf8;
      }
      .controls button.active {
        color: #38bdf8;
        border-color: #38bdf8;
        background: rgba(56, 189, 248, 0.1);
      }
      .controls input[type="range"] {
        width: 120px;
        accent-color: #38bdf8;
      }
      .controls .label {
        color: #5a5a5a;
        font-size: 9px;
        letter-spacing: 0.1em;
      }
    </style>
  </head>
  <body>
    <canvas class="webgl"></canvas>

    <div class="hud">
      <div class="title">LOG_32 // RESONANCE</div>
      <div class="sub">
        AUDIO ANALYSIS → SHADER UNIFORMS<br />
        CLICK TO START · ADJUST SENSITIVITY
      </div>
    </div>

    <div class="controls">
      <button id="playBtn">PLAY</button>
      <div class="label">GAIN</div>
      <input
        type="range"
        id="gainSlider"
        min="0"
        max="3"
        step="0.1"
        value="1.5"
      />
      <div class="label">SMOOTHING</div>
      <input
        type="range"
        id="smoothSlider"
        min="0"
        max="0.95"
        step="0.05"
        value="0.8"
      />
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
