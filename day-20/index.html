<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Day 20 - Camera choreography</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
        background: #0a0a0f;
        font-family: "Space Mono", monospace;
        color: #f4f1ea;
      }

      canvas {
        display: block;
      }

      .panel {
        position: fixed;
        bottom: 28px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 2px;
        z-index: 10;
      }

      .panel button {
        background: rgba(10, 10, 15, 0.8);
        color: #f4f1ea;
        border: 1px solid #333;
        font-family: inherit;
        font-size: 11px;
        letter-spacing: 0.12em;
        padding: 10px 18px;
        cursor: pointer;
      }

      .panel button:hover {
        border-color: #c1121f;
        color: #c1121f;
      }

      .tag {
        position: fixed;
        top: 24px;
        left: 24px;
        font-size: 11px;
        letter-spacing: 0.12em;
        opacity: 0.5;
        z-index: 10;
      }
    </style>
  </head>

  <body>
    <p class="tag">LOG_20 — CAMERA CHOREOGRAPHY</p>
    <div class="panel">
      <button data-view="FRONT">FRONT</button>
      <button data-view="SIDE">SIDE</button>
      <button data-view="REAR">REAR</button>
      <button data-view="TOP">TOP</button>
      <button data-view="DETAIL">DETAIL</button>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
