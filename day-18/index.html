<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Day 18a - Scatter transition</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        background: #14171c;
        overflow: hidden;
        font-family: "Space Mono", monospace;
        color: #f4f1ea;
      }

      .page {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 32px;
      }

      #page-label {
        font-size: 42px;
        letter-spacing: 0.1em;
      }

      #go-btn {
        background: #c1121f;
        color: #0a0a0a;
        border: none;
        font-family: inherit;
        font-size: 13px;
        letter-spacing: 0.15em;
        padding: 14px 28px;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <div class="page">
      <div id="page-label">PAGE_01 // HOME</div>
      <button id="go-btn">NAVIGATE →</button>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
